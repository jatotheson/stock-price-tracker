<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Prices</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050608;
      color: #f7f8fa;
      --accent: #00c805;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 18% 0%, #15201a 0, transparent 30rem), #050608;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    .identity {
      min-width: 0;
    }

    .symbol {
      margin: 0;
      font-size: 42px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: 0;
    }

    .name {
      margin-top: 8px;
      color: #a8afb8;
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quote {
      text-align: right;
      white-space: nowrap;
    }

    .price {
      font-size: 34px;
      line-height: 1;
      font-weight: 700;
    }

    .change {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 650;
    }

    .stock-picker {
      position: relative;
      margin: 18px 0 10px;
    }

    .search-input {
      appearance: none;
      width: 100%;
      border: 1px solid #2a3038;
      background: #0d1117;
      color: #f7f8fa;
      border-radius: 8px;
      min-height: 44px;
      padding: 0 14px;
      font: inherit;
      font-weight: 650;
    }

    .search-input::placeholder {
      color: #747d8a;
    }

    .search-input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .search-results {
      position: absolute;
      z-index: 10;
      top: calc(100% + 6px);
      left: 0;
      display: none;
      width: min(540px, 100%);
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid #2a3038;
      border-radius: 8px;
      background: #0d1117;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
    }

    .search-results.is-open {
      display: block;
    }

    .search-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #f7f8fa;
      padding: 0 12px;
      text-align: left;
    }

    .search-result:hover,
    .search-result.is-focused {
      background: #151b23;
      border-color: transparent;
    }

    .result-symbol {
      font-weight: 780;
    }

    .result-name {
      min-width: 0;
      color: #89919c;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 0;
      margin: 10px 0 18px;
    }

    button {
      appearance: none;
      border: 1px solid #2a3038;
      background: #11151b;
      color: #d8dde4;
      border-radius: 8px;
      min-height: 38px;
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      border-color: #596273;
    }

    button.active {
      border-color: var(--accent);
      color: #061006;
      background: var(--accent);
    }

    .stock-toggle-wrap {
      position: relative;
      display: inline-flex;
    }

    .stock-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-color: var(--stock-color);
      color: #f7f8fa;
      padding-right: 22px;
    }

    .stock-toggle.is-hidden {
      border-color: #2a3038;
      color: #89919c;
      background: #0d1117;
    }

    .swatch {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--stock-color);
    }

    .stock-toggle.is-hidden .swatch {
      border: 1px solid var(--stock-color);
      background: transparent;
    }

    .toggle-state {
      color: #89919c;
      font-size: 12px;
      font-weight: 780;
      text-transform: uppercase;
    }

    .remove-stock {
      position: absolute;
      top: -7px;
      right: -7px;
      display: none;
      place-items: center;
      width: 18px;
      height: 18px;
      min-height: 18px;
      padding: 0;
      border-radius: 999px;
      border-color: #3b434f;
      background: #f7f8fa;
      color: #050608;
      font-size: 11px;
      line-height: 1;
      font-weight: 900;
    }

    .stock-toggle-wrap:hover .remove-stock,
    .stock-toggle-wrap:focus-within .remove-stock {
      display: grid;
    }

    .remove-stock:hover {
      border-color: var(--stock-color);
      background: var(--stock-color);
      color: #050608;
    }

    .range-panel {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 18px;
      padding: 16px 0;
      border-top: 1px solid #1c2229;
      border-bottom: 1px solid #1c2229;
    }

    .range-title {
      font-size: 13px;
      color: #89919c;
      margin-bottom: 6px;
    }

    .database-range {
      font-size: 16px;
      font-weight: 700;
    }

    .date-controls {
      display: flex;
      align-items: end;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #89919c;
      font-size: 12px;
      font-weight: 700;
    }

    input[type="date"] {
      appearance: none;
      border: 1px solid #2a3038;
      background: #0d1117;
      color: #f7f8fa;
      border-radius: 8px;
      min-height: 38px;
      padding: 0 10px;
      font: inherit;
      color-scheme: dark;
    }

    input[type="date"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .range-error {
      min-height: 18px;
      margin: -10px 0 14px;
      color: #ff886d;
      font-size: 13px;
      font-weight: 650;
    }

    .chart-shell {
      position: relative;
      height: min(66vh, 620px);
      min-height: 420px;
      border-top: 1px solid #1c2229;
      border-bottom: 1px solid #1c2229;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 14px;
      color: #89919c;
      font-size: 13px;
    }

    @media (max-width: 720px) {
      main {
        width: min(100vw - 20px, 1180px);
        padding-top: 18px;
      }

      .topbar {
        display: block;
      }

      .quote {
        text-align: left;
        margin-top: 18px;
      }

      .symbol {
        font-size: 36px;
      }

      .range-panel {
        display: block;
      }

      .date-controls {
        justify-content: flex-start;
        margin-top: 14px;
      }

      .search-results {
        width: 100%;
      }

      .chart-shell {
        min-height: 360px;
        height: 58vh;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="topbar" aria-live="polite">
      <div class="identity">
        <h1 class="symbol" id="symbolLabel"></h1>
        <div class="name" id="nameLabel"></div>
      </div>
      <div class="quote">
        <div class="price" id="priceLabel"></div>
        <div class="change" id="changeLabel"></div>
      </div>
    </section>

    <section class="stock-picker" id="stockPicker">
      <input
        class="search-input"
        id="stockSearchInput"
        type="search"
        autocomplete="off"
        placeholder="Search symbols or company names"
        aria-label="Search stocks"
        aria-controls="stockSearchResults">
      <div class="search-results" id="stockSearchResults" role="listbox"></div>
    </section>

    <nav class="buttons" id="stockButtons" aria-label="Selected stocks"></nav>

    <section class="range-panel" aria-label="Date range">
      <div>
        <div class="range-title">Database Range</div>
        <div class="database-range" id="databaseRangeLabel"></div>
      </div>
      <div class="date-controls">
        <label>
          <span>Start</span>
          <input id="startDateInput" type="date">
        </label>
        <label>
          <span>End</span>
          <input id="endDateInput" type="date">
        </label>
        <button id="resetRangeButton" type="button">All</button>
      </div>
    </section>

    <div class="range-error" id="rangeError" role="status"></div>

    <section class="chart-shell">
      <canvas id="chart"></canvas>
    </section>

    <section class="meta">
      <span id="rangeLabel"></span>
      <span id="pointLabel"></span>
    </section>
  </main>

  <script>
    const STOCK_DATA = __DATA__;
    const symbols = Object.keys(STOCK_DATA).sort();
    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");
    const stockPicker = document.getElementById("stockPicker");
    const searchInput = document.getElementById("stockSearchInput");
    const searchResults = document.getElementById("stockSearchResults");
    const buttons = document.getElementById("stockButtons");
    const symbolLabel = document.getElementById("symbolLabel");
    const nameLabel = document.getElementById("nameLabel");
    const priceLabel = document.getElementById("priceLabel");
    const changeLabel = document.getElementById("changeLabel");
    const rangeLabel = document.getElementById("rangeLabel");
    const pointLabel = document.getElementById("pointLabel");
    const databaseRangeLabel = document.getElementById("databaseRangeLabel");
    const startDateInput = document.getElementById("startDateInput");
    const endDateInput = document.getElementById("endDateInput");
    const resetRangeButton = document.getElementById("resetRangeButton");
    const rangeError = document.getElementById("rangeError");

    const colorPalette = [
      "#18a0fb",
      "#ff6b6b",
      "#ffd166",
      "#06d6a0",
      "#b388ff",
      "#ff9f1c",
      "#4cc9f0",
      "#f72585",
      "#90be6d",
      "#f94144",
      "#577590",
      "#43aa8b"
    ];
    const defaultSelectedSymbols = ["AAPL", "NVDA"];

    let selectedStocks = [];
    let nextColorIndex = 0;
    let focusedSearchIndex = -1;
    let hover = null;
    let geometry = null;
    let selectedRange = null;

    const currency = new Intl.NumberFormat(undefined, {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 2
    });
    const percent = new Intl.NumberFormat(undefined, {
      style: "percent",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
    const compactDate = new Intl.DateTimeFormat(undefined, {
      month: "short",
      day: "numeric"
    });
    const fullDate = new Intl.DateTimeFormat(undefined, {
      month: "short",
      day: "numeric",
      year: "numeric"
    });
    const hoverDate = new Intl.DateTimeFormat(undefined, {
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    });

    function setAccent(color) {
      document.documentElement.style.setProperty("--accent", color);
    }

    function formatPrice(value) {
      return currency.format(value);
    }

    function formatChange(first, last) {
      const absolute = last - first;
      const ratio = first === 0 ? 0 : absolute / first;
      const sign = absolute >= 0 ? "+" : "";
      return `${sign}${formatPrice(absolute)} (${sign}${percent.format(ratio)})`;
    }

    function stockName(symbol) {
      return STOCK_DATA[symbol].name || symbol;
    }

    function computeDataBounds() {
      let min = Infinity;
      let max = -Infinity;
      for (const symbol of symbols) {
        const times = STOCK_DATA[symbol].t;
        if (!times.length) continue;
        min = Math.min(min, times[0]);
        max = Math.max(max, times[times.length - 1]);
      }
      return { min, max };
    }

    const dataBounds = computeDataBounds();

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function toDateInputValue(timestamp) {
      const date = new Date(timestamp);
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
    }

    function parseDateInputStart(value) {
      const parts = value.split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return NaN;
      return new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0).getTime();
    }

    function parseDateInputEnd(value) {
      const parts = value.split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return NaN;
      return new Date(parts[0], parts[1] - 1, parts[2] + 1, 0, 0, 0, 0).getTime() - 1;
    }

    function selectedRangeLabel() {
      if (!selectedRange) return "";
      return `${fullDate.format(new Date(selectedRange.start))} - ${fullDate.format(new Date(selectedRange.end))}`;
    }

    function lowerBound(values, target) {
      let lo = 0;
      let hi = values.length;
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (values[mid] < target) lo = mid + 1;
        else hi = mid;
      }
      return lo;
    }

    function upperBound(values, target) {
      let lo = 0;
      let hi = values.length;
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (values[mid] <= target) lo = mid + 1;
        else hi = mid;
      }
      return lo;
    }

    function visiblePointsFor(points) {
      if (!points || !selectedRange) return { name: "", t: [], p: [], count: 0 };
      const startIndex = lowerBound(points.t, selectedRange.start);
      const endIndex = upperBound(points.t, selectedRange.end);
      return {
        name: points.name,
        t: points.t.slice(startIndex, endIndex),
        p: points.p.slice(startIndex, endIndex),
        count: Math.max(0, endIndex - startIndex)
      };
    }

    function visibleStocks() {
      return selectedStocks.filter((stock) => stock.visible);
    }

    function pointCountText() {
      if (!selectedStocks.length) return "No stocks selected";

      const activeStocks = visibleStocks();
      if (!activeStocks.length) return "No stocks visible";

      let pointCount = 0;
      for (const stock of activeStocks) {
        pointCount += visiblePointsFor(STOCK_DATA[stock.symbol]).count;
      }

      const stockText = activeStocks.length === 1 ? "stock" : "stocks";
      return `${pointCount.toLocaleString()} points across ${activeStocks.length.toLocaleString()} visible ${stockText}`;
    }

    function initRangeControls() {
      if (!Number.isFinite(dataBounds.min) || !Number.isFinite(dataBounds.max)) {
        databaseRangeLabel.textContent = "No data";
        return;
      }

      const minValue = toDateInputValue(dataBounds.min);
      const maxValue = toDateInputValue(dataBounds.max);
      databaseRangeLabel.textContent = `${fullDate.format(new Date(dataBounds.min))} - ${fullDate.format(new Date(dataBounds.max))}`;

      for (const input of [startDateInput, endDateInput]) {
        input.min = minValue;
        input.max = maxValue;
      }

      startDateInput.value = minValue;
      endDateInput.value = maxValue;
      selectedRange = {
        start: dataBounds.min,
        end: dataBounds.max
      };
    }

    function applyDateRange() {
      const start = parseDateInputStart(startDateInput.value);
      const end = parseDateInputEnd(endDateInput.value);

      if (!Number.isFinite(start) || !Number.isFinite(end)) {
        rangeError.textContent = "Enter a valid start and end date.";
        return;
      }

      if (start > end) {
        rangeError.textContent = "Start date must be before end date.";
        return;
      }

      rangeError.textContent = "";
      selectedRange = {
        start: Math.max(start, dataBounds.min),
        end: Math.min(end, dataBounds.max)
      };
      hover = null;
      draw();
    }

    function resetDateRange() {
      startDateInput.value = toDateInputValue(dataBounds.min);
      endDateInput.value = toDateInputValue(dataBounds.max);
      applyDateRange();
    }

    function isStockSelected(symbol) {
      return selectedStocks.some((stock) => stock.symbol === symbol);
    }

    function searchRank(symbol, query) {
      const normalizedSymbol = symbol.toLowerCase();
      const normalizedName = stockName(symbol).toLowerCase();
      if (normalizedSymbol === query) return 0;
      if (normalizedSymbol.startsWith(query)) return 1;
      if (normalizedName.startsWith(query)) return 2;
      if (normalizedSymbol.includes(query)) return 3;
      if (normalizedName.includes(query)) return 4;
      return 99;
    }

    function searchMatches(query) {
      const normalized = query.trim().toLowerCase();
      if (!normalized) return [];

      return symbols
        .filter((symbol) => !isStockSelected(symbol))
        .map((symbol) => ({ symbol, rank: searchRank(symbol, normalized) }))
        .filter((match) => match.rank < 99)
        .sort((a, b) => a.rank - b.rank || a.symbol.localeCompare(b.symbol))
        .slice(0, 10)
        .map((match) => match.symbol);
    }

    function closeSearchResults() {
      searchResults.classList.remove("is-open");
      searchResults.innerHTML = "";
      focusedSearchIndex = -1;
    }

    function renderSearchResults() {
      const matches = searchMatches(searchInput.value);
      searchResults.innerHTML = "";

      if (!matches.length) {
        closeSearchResults();
        return;
      }

      if (focusedSearchIndex >= matches.length) {
        focusedSearchIndex = matches.length - 1;
      }

      matches.forEach((symbol, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "search-result";
        button.setAttribute("role", "option");
        button.setAttribute("aria-selected", index === focusedSearchIndex ? "true" : "false");
        button.classList.toggle("is-focused", index === focusedSearchIndex);
        button.addEventListener("mousedown", (event) => event.preventDefault());
        button.addEventListener("click", () => addStock(symbol));

        const symbolLabel = document.createElement("span");
        symbolLabel.className = "result-symbol";
        symbolLabel.textContent = symbol;

        const nameLabel = document.createElement("span");
        nameLabel.className = "result-name";
        nameLabel.textContent = stockName(symbol);

        button.append(symbolLabel, nameLabel);
        searchResults.appendChild(button);
      });

      searchResults.classList.add("is-open");
    }

    function nextStockColor() {
      const usedColors = new Set(selectedStocks.map((stock) => stock.color));
      for (let i = 0; i < colorPalette.length; i++) {
        const color = colorPalette[nextColorIndex % colorPalette.length];
        nextColorIndex += 1;
        if (!usedColors.has(color)) return color;
      }

      const hue = Math.round((nextColorIndex * 137.508) % 360);
      nextColorIndex += 1;
      return `hsl(${hue} 78% 60%)`;
    }

    function initDefaultSelectedStocks() {
      for (const symbol of defaultSelectedSymbols) {
        if (!STOCK_DATA[symbol] || isStockSelected(symbol)) continue;
        selectedStocks.push({
          symbol,
          color: nextStockColor(),
          visible: true
        });
      }
    }

    function addStock(symbol) {
      const normalized = symbol.trim().toUpperCase();
      if (!STOCK_DATA[normalized]) return;

      const existing = selectedStocks.find((stock) => stock.symbol === normalized);
      if (existing) {
        existing.visible = true;
      } else {
        selectedStocks.push({
          symbol: normalized,
          color: nextStockColor(),
          visible: true
        });
      }

      searchInput.value = "";
      closeSearchResults();
      renderSelectedButtons();
      hover = null;
      draw();
      searchInput.focus();
    }

    function toggleStock(symbol) {
      const stock = selectedStocks.find((item) => item.symbol === symbol);
      if (!stock) return;
      stock.visible = !stock.visible;
      renderSelectedButtons();
      hover = null;
      draw();
    }

    function removeStock(symbol) {
      selectedStocks = selectedStocks.filter((stock) => stock.symbol !== symbol);
      renderSelectedButtons();
      renderSearchResults();
      hover = null;
      draw();
    }

    function renderSelectedButtons() {
      buttons.innerHTML = "";

      for (const stock of selectedStocks) {
        const wrapper = document.createElement("span");
        wrapper.className = "stock-toggle-wrap";
        wrapper.style.setProperty("--stock-color", stock.color);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "stock-toggle";
        button.classList.toggle("is-visible", stock.visible);
        button.classList.toggle("is-hidden", !stock.visible);
        button.setAttribute("aria-pressed", stock.visible ? "true" : "false");
        button.title = stockName(stock.symbol);
        button.addEventListener("click", () => toggleStock(stock.symbol));

        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.setAttribute("aria-hidden", "true");

        const symbol = document.createElement("span");
        symbol.textContent = stock.symbol;

        const state = document.createElement("span");
        state.className = "toggle-state";
        state.textContent = stock.visible ? "On" : "Off";

        button.append(swatch, symbol, state);

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "remove-stock";
        removeButton.textContent = "X";
        removeButton.title = `Remove ${stock.symbol}`;
        removeButton.setAttribute("aria-label", `Remove ${stock.symbol}`);
        removeButton.addEventListener("click", (event) => {
          event.stopPropagation();
          removeStock(stock.symbol);
        });

        wrapper.append(button, removeButton);
        buttons.appendChild(wrapper);
      }
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(280, Math.floor(rect.height));
      if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { width, height };
    }

    function nearestIndex(times, target) {
      if (!times.length) return -1;

      let lo = 0;
      let hi = times.length - 1;
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (times[mid] < target) lo = mid + 1;
        else hi = mid;
      }
      if (lo > 0 && Math.abs(times[lo - 1] - target) < Math.abs(times[lo] - target)) {
        return lo - 1;
      }
      return lo;
    }

    function labelBox(text, x, y, align = "center") {
      ctx.save();
      ctx.font = "12px Inter, system-ui, sans-serif";
      const metrics = ctx.measureText(text);
      const padX = 8;
      const width = metrics.width + padX * 2;
      const height = 24;
      let left = align === "right" ? x - width : align === "left" ? x : x - width / 2;
      left = Math.max(6, Math.min(geometry.width - width - 6, left));
      const top = Math.max(6, Math.min(geometry.height - height - 6, y));
      ctx.fillStyle = "#f7f8fa";
      roundRect(left, top, width, height, 6);
      ctx.fill();
      ctx.fillStyle = "#050608";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, left + width / 2, top + height / 2 + 0.5);
      ctx.restore();
    }

    function roundRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    function drawGrid(plot, minY, maxY, minX, maxX) {
      ctx.save();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(255,255,255,0.075)";
      ctx.fillStyle = "#808894";
      ctx.font = "12px Inter, system-ui, sans-serif";
      ctx.textBaseline = "middle";
      ctx.textAlign = "right";

      for (let i = 0; i <= 4; i++) {
        const y = plot.top + (plot.height * i) / 4;
        const value = maxY - ((maxY - minY) * i) / 4;
        ctx.beginPath();
        ctx.moveTo(plot.left, y);
        ctx.lineTo(plot.right, y);
        ctx.stroke();
        ctx.fillText(formatPrice(value), plot.right - 4, y - 8);
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (let i = 0; i <= 4; i++) {
        const x = plot.left + (plot.width * i) / 4;
        const value = minX + ((maxX - minX) * i) / 4;
        ctx.fillText(compactDate.format(new Date(value)), x, plot.bottom + 10);
      }
      ctx.restore();
    }

    function drawLine(series, plot, minY, maxY, minX, maxX) {
      const times = series.points.t;
      const prices = series.points.p;
      const xScale = plot.width / Math.max(1, maxX - minX);
      const yScale = plot.height / Math.max(0.01, maxY - minY);

      ctx.save();
      ctx.lineWidth = 2.25;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = series.color;
      ctx.beginPath();
      for (let i = 0; i < times.length; i++) {
        const x = plot.left + (times[i] - minX) * xScale;
        const y = plot.bottom - (prices[i] - minY) * yScale;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawHover(seriesList, plot, minY, maxY, minX, maxX) {
      if (!hover || !geometry) return;
      if (hover.x < plot.left || hover.x > plot.right || hover.y < plot.top || hover.y > plot.bottom) return;

      const targetTime = minX + ((hover.x - plot.left) / plot.width) * (maxX - minX);
      const items = [];

      for (const series of seriesList) {
        const times = series.points.t;
        const prices = series.points.p;
        const index = nearestIndex(times, targetTime);
        if (index < 0) continue;

        const time = times[index];
        const price = prices[index];
        const x = plot.left + ((time - minX) / Math.max(1, maxX - minX)) * plot.width;
        const y = plot.bottom - ((price - minY) / Math.max(0.01, maxY - minY)) * plot.height;
        items.push({ symbol: series.symbol, color: series.color, time, price, x, y });
      }

      if (!items.length) return;

      ctx.save();
      ctx.strokeStyle = "rgba(247,248,250,0.28)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(hover.x, plot.top);
      ctx.lineTo(hover.x, plot.bottom);
      ctx.stroke();
      ctx.setLineDash([]);

      for (const item of items) {
        ctx.fillStyle = item.color;
        ctx.beginPath();
        ctx.arc(item.x, item.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      labelBox(hoverDate.format(new Date(items[0].time)), hover.x, plot.bottom + 36);
      pointLabel.textContent = items
        .map((item) => `${item.symbol} ${formatPrice(item.price)}`)
        .join("  |  ");
    }

    function selectedSeries() {
      return visibleStocks().map((stock) => ({
        symbol: stock.symbol,
        color: stock.color,
        points: visiblePointsFor(STOCK_DATA[stock.symbol])
      }));
    }

    function seriesBounds(seriesList) {
      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;

      for (const series of seriesList) {
        const times = series.points.t;
        const prices = series.points.p;
        if (!times.length) continue;

        minX = Math.min(minX, times[0]);
        maxX = Math.max(maxX, times[times.length - 1]);

        for (const price of prices) {
          minY = Math.min(minY, price);
          maxY = Math.max(maxY, price);
        }
      }

      return { minX, maxX, minY, maxY };
    }

    function updateSummary() {
      const activeStocks = visibleStocks();

      if (!selectedStocks.length) {
        symbolLabel.textContent = "Stock Prices";
        nameLabel.textContent = "No stocks selected";
        priceLabel.textContent = "0 shown";
        changeLabel.textContent = "No stocks selected";
        changeLabel.style.color = "#a8afb8";
        return;
      }

      if (selectedStocks.length === 1) {
        const stock = selectedStocks[0];
        const points = visiblePointsFor(STOCK_DATA[stock.symbol]);
        symbolLabel.textContent = stock.symbol;
        nameLabel.textContent = stockName(stock.symbol);

        if (!stock.visible) {
          priceLabel.textContent = "--";
          changeLabel.textContent = "Hidden";
          changeLabel.style.color = "#a8afb8";
          return;
        }

        if (!points.t.length) {
          priceLabel.textContent = "--";
          changeLabel.textContent = "No data in selected range";
          changeLabel.style.color = "#a8afb8";
          return;
        }

        const first = points.p[0];
        const last = points.p[points.p.length - 1];
        priceLabel.textContent = formatPrice(last);
        changeLabel.textContent = formatChange(first, last);
        changeLabel.style.color = stock.color;
        return;
      }

      const hiddenCount = selectedStocks.length - activeStocks.length;
      symbolLabel.textContent = `${selectedStocks.length} Stocks`;
      nameLabel.textContent = selectedStocks.map((stock) => stock.symbol).join(", ");
      priceLabel.textContent = `${activeStocks.length} shown`;
      changeLabel.textContent = hiddenCount === 0 ? "All visible" : `${hiddenCount} hidden`;
      changeLabel.style.color = "#a8afb8";
    }

    function drawEmptyMessage(message, plot) {
      ctx.fillStyle = "#a8afb8";
      ctx.font = "16px Inter, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(message, geometry.width / 2, plot.top + plot.height / 2);
    }

    function draw() {
      geometry = resizeCanvas();
      const activeStocks = visibleStocks();
      setAccent(activeStocks[0]?.color || "#00c805");

      ctx.clearRect(0, 0, geometry.width, geometry.height);
      ctx.fillStyle = "#050608";
      ctx.fillRect(0, 0, geometry.width, geometry.height);

      const plot = {
        left: 18,
        right: geometry.width - 18,
        top: 18,
        bottom: geometry.height - 46
      };
      plot.width = plot.right - plot.left;
      plot.height = plot.bottom - plot.top;

      updateSummary();

      if (!selectedStocks.length) {
        drawEmptyMessage("No stocks selected", plot);
        rangeLabel.textContent = selectedRangeLabel();
        pointLabel.textContent = pointCountText();
        return;
      }

      if (!activeStocks.length) {
        drawEmptyMessage("No stocks visible", plot);
        rangeLabel.textContent = selectedRangeLabel();
        pointLabel.textContent = pointCountText();
        return;
      }

      const seriesList = selectedSeries().filter((series) => series.points.t.length > 0);
      if (!seriesList.length) {
        drawEmptyMessage("No data in selected date range", plot);
        rangeLabel.textContent = selectedRangeLabel();
        pointLabel.textContent = "0 points in range";
        return;
      }

      const bounds = seriesBounds(seriesList);
      let { minX, maxX, minY, maxY } = bounds;
      const yPad = Math.max((maxY - minY) * 0.08, Math.abs(maxY) * 0.005, 0.5);
      minY -= yPad;
      maxY += yPad;

      rangeLabel.textContent = `${compactDate.format(new Date(minX))} - ${compactDate.format(new Date(maxX))}`;
      if (!hover) pointLabel.textContent = pointCountText();

      drawGrid(plot, minY, maxY, minX, maxX);
      for (const series of seriesList) {
        drawLine(series, plot, minY, maxY, minX, maxX);
      }
      drawHover(seriesList, plot, minY, maxY, minX, maxX);
    }

    searchInput.addEventListener("input", () => {
      focusedSearchIndex = -1;
      renderSearchResults();
    });

    searchInput.addEventListener("focus", renderSearchResults);

    searchInput.addEventListener("keydown", (event) => {
      const matches = searchMatches(searchInput.value);
      if (event.key === "ArrowDown" && matches.length) {
        event.preventDefault();
        focusedSearchIndex = (focusedSearchIndex + 1) % matches.length;
        renderSearchResults();
      } else if (event.key === "ArrowUp" && matches.length) {
        event.preventDefault();
        focusedSearchIndex = focusedSearchIndex <= 0 ? matches.length - 1 : focusedSearchIndex - 1;
        renderSearchResults();
      } else if (event.key === "Enter" && matches.length) {
        event.preventDefault();
        addStock(matches[Math.max(0, focusedSearchIndex)]);
      } else if (event.key === "Escape") {
        closeSearchResults();
      }
    });

    document.addEventListener("click", (event) => {
      if (!stockPicker.contains(event.target)) closeSearchResults();
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      hover = {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
      draw();
    });

    canvas.addEventListener("mouseleave", () => {
      hover = null;
      pointLabel.textContent = pointCountText();
      draw();
    });

    startDateInput.addEventListener("change", applyDateRange);
    endDateInput.addEventListener("change", applyDateRange);
    resetRangeButton.addEventListener("click", resetDateRange);
    window.addEventListener("resize", draw);
    initRangeControls();
    initDefaultSelectedStocks();
    renderSelectedButtons();
    draw();
  </script>
</body>
</html>
